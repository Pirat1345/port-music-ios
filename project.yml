name: PortMusic
options:
  bundleIdPrefix: com.portmusic
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PortMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PortMusic
    scheme:
      gatherCoverageData: false
    settings:
      base:
        PRODUCT_NAME: "Port Music"
        PRODUCT_BUNDLE_IDENTIFIER: com.portmusic.app
        INFOPLIST_FILE: PortMusic/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
