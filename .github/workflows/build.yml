name: Build Octave iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Octave IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 Version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Build Octave App & Widgets
        run: |
          set -e
          xcodebuild clean build \
            -project Octave.xcodeproj \
            -scheme octave \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            OTHER_SWIFT_FLAGS="-Xfrontend -strict-concurrency=minimal"

      - name: Package into IPA
        run: |
          set -e
          mkdir -p build/Payload
          APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y Octave.ipa Payload
          echo "IPA packaging complete!"

      - name: Upload Octave IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Octave-iOS-IPA
          path: build/Octave.ipa
          retention-days: 14
